    <main id="main-content" tabindex="-1">
      <section class="page-hero"><p class="eyebrow reveal">SUPPORT</p><h1 class="reveal">售后服务 / 设备报修</h1><p class="reveal">请提供设备型号、序列号和故障描述，科默斯技术支持团队将根据您提交的信息进行排查。</p></section>
      <section class="section form-section">
        <form class="kemesser-form reveal" data-kemesser-form data-form-type="support" aria-label="售后服务工单" enctype="multipart/form-data">
          <div hidden><input type="text" name="_honey" tabindex="-1" autocomplete="off" /></div>
          <div class="form-grid">
            <label>联系人姓名 *<input type="text" name="联系人姓名" autocomplete="name" required /></label><label>公司名称 *<input type="text" name="公司名称" autocomplete="organization" required /></label><label>手机号 *<input type="tel" name="手机号" autocomplete="tel" inputmode="tel" required /></label><label>邮箱 *<input type="email" name="邮箱" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="none" required /></label><label>产品型号 *<select name="产品型号" required data-product-options></select></label><label>设备序列号 SN *<input type="text" name="设备序列号 SN" autocomplete="off" spellcheck="false" autocapitalize="none" required /></label><label>错误代码<input type="text" name="错误代码" autocomplete="off" spellcheck="false" autocapitalize="none" /></label><label>是否影响实验进行 *<select name="是否影响实验进行" required><option value="">请选择</option><option>是</option><option>否</option></select></label>
          </div>
          <label>故障现象描述 *<textarea name="故障现象描述" required></textarea></label>
          <label>附件上传<input type="file" name="attachment" accept=".png,.jpg,.jpeg,.webp,.pdf,.txt" aria-describedby="attachment-hint" /></label>
          <small class="field-hint" id="attachment-hint">支持 PNG、JPG、JPEG、WebP、PDF 或 TXT，附件总大小不超过 10 MB。如上传失败，请发送邮件至 <a href="mailto:andy@kemesser.com">andy@kemesser.com</a>。</small>
          <label class="privacy-check"><input type="checkbox" name="consent" value="yes" required /> 我同意杭州科默斯科技有限公司处理我提供的联系信息，以便提供本次技术支持。</label>
          <button class="btn btn-primary" type="submit">提交售后工单</button>
          <p class="form-message" data-form-message role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
      </section>
