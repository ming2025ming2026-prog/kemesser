      <section class="page-hero"><p class="eyebrow reveal">INQUIRY</p><h1 class="reveal">售前询盘</h1><p class="reveal">请留下关注产品、应用场景和采购计划，科默斯团队将尽快与您联系。</p></section>
      <section class="section form-section">

            <label>姓名 *<input type="text" name="姓名" autocomplete="name" required /></label><label>公司名称 *<input type="text" name="公司名称" autocomplete="organization" required /></label><label>手机号 *<input type="tel" name="手机号" autocomplete="tel" inputmode="tel" required /></label><label>邮箱<input type="email" name="邮箱" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="none" /></label><label>国家 / 地区<input type="text" name="国家 / 地区" autocomplete="country-name" /></label><label>关注产品 *<select name="关注产品" required data-product-options></select></label><label>应用场景<input name="应用场景" /></label><label>采购计划<input name="采购计划" /></label>
